name: Alemona Launcher release

on:
  push:
    tags:
      - 'a*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            args: ''
          - label: macOS
            os: macos-latest
            args: '--target universal-apple-darwin'
          - label: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec turbo run build --filter=@modrinth/app-frontend --force
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TURBO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Build the launcher
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Alemona Launcher ${{ github.ref_name }}
          releaseBody: |
            "Colorful Update" is an update for the Alemona Launcher. This update updates the Accent colour and Secondary accent colour, allowing you to choose and match them with your own launcher color scheme.
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
